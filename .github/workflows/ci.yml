name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Higiene y estilo de todo el repositorio: hooks comunes, ruff con la
  # configuración de cada paquete y verificación de archivos.
  higiene:
    name: Higiene y estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Ejecutar hooks sobre todo el repositorio
        run: pre-commit run --all-files --show-diff-on-failure
