name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide qué paquetes se verifican. Los archivos compartidos activan todos
  # los paquetes, porque un cambio ahí puede romper cualquiera de ellos.
  cambios:
    name: Detectar paquetes afectados
    runs-on: ubuntu-latest
    outputs:
      diagram_db: ${{ steps.filtros.outputs.diagram_db }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filtros
        with:
          filters: |
            diagram_db:
              - 'packages/diagram-db/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-diagram-db.yml'
              - '.pre-commit-config.yaml'

  # Higiene y estilo de todo el repositorio: hooks comunes, ruff con la
  # configuración de cada paquete y verificación de archivos.
  higiene:
    name: Higiene y estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Ejecutar hooks sobre todo el repositorio
        run: pre-commit run --all-files --show-diff-on-failure

  diagram_db:
    name: diagram-db
    needs: cambios
    if: needs.cambios.outputs.diagram_db == 'true'
    uses: ./.github/workflows/ci-diagram-db.yml
