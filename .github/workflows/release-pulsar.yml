name: Release pulsar

# Publicación independiente del paquete: solo se dispara con tags
# pulsar-vX.Y.Z, nunca con los tags de otro paquete.

on:
  push:
    tags: ["pulsar-v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/pulsar

jobs:
  test:
    name: Comprobar versión y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que el tag coincide con la versión del módulo
        run: |
          version="${GITHUB_REF_NAME#pulsar-v}"
          modulo=$(python -c "import pulsar; print(pulsar.__version__)")
          echo "Tag: $version · módulo: $modulo"
          if [ "$version" != "$modulo" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con pulsar.__version__ ($modulo)"
            exit 1
          fi

      - name: Tests unitarios
        run: python -m unittest discover -s tests -v

  release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir sdist y wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Crear la GitHub Release con los artefactos
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: packages/pulsar/dist/*
          generate_release_notes: true

  publish:
    # Trusted publishing (OIDC): sin tokens ni secretos. Requiere el publisher
    # configurado en PyPI para owner jeironpro, repository python-packages,
    # workflow release-pulsar.yml y environment pypi.
    name: Publicar en PyPI (trusted publishing)
    needs: [test, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # Se reconstruye desde el tag en lugar de pasar artefactos entre jobs: la
      # cuenta tiene la cuota de artefactos agotada y el build es reproducible.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir el paquete
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Publicar sdist y wheel
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pulsar/dist

  verify:
    name: Verificar publicación en PyPI
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar la versión publicada en PyPI
        run: |
          version="${GITHUB_REF_NAME#pulsar-v}"
          echo "Versión esperada: $version"
          json=""
          for i in 1 2 3 4 5 6; do
            if json=$(curl -fsSL "https://pypi.org/pypi/pulsar-psr/json" 2>/dev/null); then
              break
            fi
            echo "Intento $i: PyPI aún no responde, reintento en 5 s..."
            sleep 5
          done
          [ -n "$json" ] || { echo "::error::PyPI no respondió tras los reintentos"; exit 1; }
          echo "$json" | VERSION="$version" python3 -c 'import json, os, sys; info = json.load(sys.stdin)["info"]; esperada = os.environ["VERSION"]; sys.exit("PyPI tiene " + info["version"] + " y se esperaba " + esperada) if info["version"] != esperada else print("PyPI OK:", info["name"], info["version"])'

      - name: Instalar desde PyPI y usar el CLI
        run: |
          version="${GITHUB_REF_NAME#pulsar-v}"
          python3 -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/pip" install --quiet "pulsar-psr==$version"
          "$RUNNER_TEMP/verify/bin/psr" version | grep -q "$version"
          "$RUNNER_TEMP/verify/bin/psr" parse -f ejemplo.psr > /dev/null
          echo "pip install pulsar-psr==$version + CLI OK"
