[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-db"
dynamic = ["version"]
description = "Genera diagramas entidad-relación con pata de cuervo a partir de un spec.md"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "jeironpro" }]
keywords = [
  "diagram",
  "entity-relationship",
  "erd",
  "graphviz",
  "markdown",
  "schema",
  "sql",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["graphviz>=0.21,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]

[project.scripts]
diagram-db = "diagram_db.cli:main"

[project.urls]
Homepage = "https://github.com/jeironpro/python-packages/tree/main/packages/diagram-db"
Documentation = "https://github.com/jeironpro/python-packages/blob/main/packages/diagram-db/docs/README.md"
Repository = "https://github.com/jeironpro/python-packages"
Issues = "https://github.com/jeironpro/python-packages/issues"
Changelog = "https://github.com/jeironpro/python-packages/blob/main/packages/diagram-db/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "diagram_db.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["diagram_db*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["landing/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["diagram_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
